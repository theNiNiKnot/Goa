<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Photos | Ni x Ni</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&family=Lobster+Two&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage: #D4B896;
      --sage-dark: #C9A876;
      --sage-soft: #f5e7d4;
      --ink: #222;
      --bg: #f8f5f1;
      --panel: #fff;
      --text: #ffffff;
      --muted: #5f544f;
      --success: #1f8f5f;
      --success-soft: #ebf9f1;
      --error: #cc4d4d;
      --error-soft: #fde9e9;
      --line: #e9dfd6;
      --shadow: rgba(61, 39, 20, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at top, #fffaf5 0%, #f2e8df 18%, #efe7df 100%);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page-shell {
      width: min(92vw, 660px);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(211, 184, 150, 0.55);
      border-radius: 26px;
      box-shadow: 0 22px 60px var(--shadow);
      padding: 30px 28px 28px;
      position: relative;
      overflow: hidden;
    }

    .page-shell::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 10px;
      background: linear-gradient(90deg, var(--sage-dark), var(--sage), #f3d7b2);
    }

    .page-header {
      text-align: center;
      margin: 18px 0 24px;
      position: relative;
      padding-top: 8px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .back-link:hover {
      color: var(--ink);
    }

    h1 {
      font-family: 'Lobster Two', cursive;
      font-size: clamp(2.5rem, 6vw, 4rem);
      color: #5c4033;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin: 0 auto 20px;
      max-width: 440px;
      font-weight: 600;
    }

    .upload-box {
      background: linear-gradient(180deg, #fffaf5 0%, #faf5ef 100%);
      border: 1px solid rgba(196, 164, 127, 0.6);
      border-radius: 20px;
      padding: 22px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .upload-dropzone {
      position: relative;
      display: block;
      width: 100%;
      padding: 24px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .upload-dropzone:hover {
      border-color: var(--sage-dark);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(113, 88, 62, 0.08);
    }

    .upload-dropzone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-label {
      display: block;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .upload-hint {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .selected-files {
      margin-top: 18px;
      display: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .selected-files.visible {
      display: block;
    }

    .selected-files h3 {
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: var(--muted);
      font-weight: 700;
    }

    .file-list {
      list-style: none;
      display: grid;
      gap: 6px;
      max-height: 180px;
      overflow: auto;
    }

    .file-list li {
      padding: 8px 10px;
      border-radius: 8px;
      background: #faf7f4;
      font-size: 0.9rem;
      color: var(--ink);
      word-break: break-word;
    }

    .progress-wrap {
      margin-top: 22px;
      display: none;
    }

    .progress-wrap.visible {
      display: block;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 700;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: #efe6df;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(129, 96, 63, 0.15);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--sage-dark), var(--sage));
      transition: width 0.2s ease;
    }

    .status {
      margin-top: 18px;
      min-height: 26px;
      font-weight: 600;
      display: none;
      border-radius: 14px;
      padding: 12px 14px;
      text-align: center;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .status.loading {
      display: block;
      background: #fff3d7;
      border-color: rgba(152, 106, 41, 0.15);
      color: #7a4d14;
    }

    .status.success {
      display: block;
      background: var(--success-soft);
      border-color: rgba(31, 143, 95, 0.18);
      color: var(--success);
      box-shadow: 0 10px 20px rgba(31, 143, 95, 0.1);
    }

    .status.error {
      display: block;
      background: var(--error-soft);
      border-color: rgba(204, 77, 77, 0.18);
      color: var(--error);
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      color: #fff;
      font-family: 'Lobster Two', cursive;
      font-size: 1.5rem;
      padding: 14px 18px;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(160, 126, 87, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(160, 126, 87, 0.32);
    }

    .submit-btn:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    @media (max-width: 560px) {
      body {
        padding: 18px;
      }

      .page-shell {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <div class="page-header">
      <a class="back-link" href="./index.html">← Back to home</a>
      <h1>Upload Photos</h1>
      <p class="subtitle">Share your favorite moments from the wedding</p>
    </div>

    <div class="upload-box">
      <label class="upload-dropzone" for="photoInput">
        <input id="photoInput" type="file" accept="image/*" multiple />
        <span class="upload-label">Choose photos</span>
        <span class="upload-hint">PNG, JPG, or HEIC files</span>
      </label>

      <div id="selectedFiles" class="selected-files">
        <h3>Selected files</h3>
        <ul id="fileList" class="file-list"></ul>
      </div>

      <div id="progressWrap" class="progress-wrap">
        <div class="progress-header">
          <span id="progressLabel">Uploading...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar" aria-label="Upload progress">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>

      <button id="uploadButton" class="submit-btn" type="button" disabled>Upload Photos</button>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const UPLOAD_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-UHqkoaPTuiY7pxPM0X-0H4W2yvMQKu077sHFKYpoVvlmuXci5r1sgK33ycdUnnAU/exec';
    const DRIVE_FOLDER_ID = '1w6jo24abdFXp0lIOxfgEcuoyOZDTBoqA';

    const photoInput = document.getElementById('photoInput');
    const uploadButton = document.getElementById('uploadButton');
    const selectedFilesBox = document.getElementById('selectedFiles');
    const fileList = document.getElementById('fileList');
    const statusBox = document.getElementById('status');
    const progressWrap = document.getElementById('progressWrap');
    const progressLabel = document.getElementById('progressLabel');
    const progressPercent = document.getElementById('progressPercent');
    const progressFill = document.getElementById('progressFill');

    function setStatus(message, type = 'loading') {
      statusBox.textContent = message;
      statusBox.className = 'status ' + type;
    }

    function updateSelectedFiles() {
      const files = photoInput.files;
      fileList.innerHTML = '';

      if (!files || files.length === 0) {
        selectedFilesBox.classList.remove('visible');
        uploadButton.disabled = true;
        return;
      }

      Array.from(files).forEach((file) => {
        const item = document.createElement('li');
        item.textContent = file.name;
        fileList.appendChild(item);
      });

      selectedFilesBox.classList.add('visible');
      uploadButton.disabled = false;
    }

    function showProgress(active, labelText = 'Uploading...') {
      progressWrap.classList.toggle('visible', active);
      if (active) {
        progressLabel.textContent = labelText;
        progressPercent.textContent = '0%';
        progressFill.style.width = '0%';
      }
    }

    function setProgress(value, label) {
      const safeValue = Math.min(100, Math.max(0, Number(value) || 0));
      progressPercent.textContent = `${Math.round(safeValue)}%`;
      progressFill.style.width = `${safeValue}%`;
      progressLabel.textContent = label;
    }

    function updateProgressByCount(completedCount, totalCount) {
      if (!totalCount || totalCount <= 0) {
        setProgress(0, 'Uploading...');
        return;
      }

      const percent = (completedCount / totalCount) * 100;
      setProgress(percent, `Uploaded ${completedCount} of ${totalCount}`);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => resolve(event.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function compressImageIfNeeded(file, maxDimension = 1600, quality = 0.72) {
      if (!file || !file.type || !file.type.startsWith('image/')) {
        return Promise.resolve(file);
      }

      const fileSizeLimitBytes = 4 * 1024 * 1024;
      if (file.size <= fileSizeLimitBytes) {
        return Promise.resolve(file);
      }

      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const image = new Image();

        image.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
            const width = Math.max(1, Math.round(image.naturalWidth * scale));
            const height = Math.max(1, Math.round(image.naturalHeight * scale));

            canvas.width = width;
            canvas.height = height;

            const context = canvas.getContext('2d');
            context.drawImage(image, 0, 0, width, height);

            const targetType = file.type.includes('png') ? 'image/png' : 'image/jpeg';
            canvas.toBlob((blob) => {
              URL.revokeObjectURL(objectUrl);

              if (!blob) {
                reject(new Error('Unable to compress this photo.'));
                return;
              }

              resolve(blob);
            }, targetType, quality);
          } catch (error) {
            URL.revokeObjectURL(objectUrl);
            reject(error);
          }
        };

        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('This file could not be processed.'));
        };

        image.src = objectUrl;
      });
    }

    async function uploadOnePhoto(file, index) {
      const compressed = await compressImageIfNeeded(file, 1600, 0.72);
      const dataUrl = await readFileAsDataUrl(compressed);
      const base64Data = dataUrl.split(',')[1];
      const fileName = 'wedding_photo_' + Date.now() + '_' + index + '_' + file.name.replace(/\s+/g, '_');

      await fetch(UPLOAD_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
        },
        body: new URLSearchParams({
          fileData: base64Data,
          fileName: fileName,
          parentFolderId: DRIVE_FOLDER_ID,
          mimeType: compressed.type || file.type
        })
      });
    }

    async function handleUpload() {
      const files = Array.from(photoInput.files || []);

      if (files.length === 0) {
        setStatus('Please select a photo first.', 'error');
        return;
      }

      if (UPLOAD_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
        setStatus('Upload URL not configured yet.', 'error');
        return;
      }

      if (DRIVE_FOLDER_ID === 'YOUR_DRIVE_FOLDER_ID_HERE') {
        setStatus('Google Drive folder ID not configured yet.', 'error');
        return;
      }

      uploadButton.disabled = true;
      showProgress(true, files.length > 1 ? 'Uploading photos...' : 'Uploading photo...');
      setStatus('Uploading...', 'loading');

      let successCount = 0;
      let failureCount = 0;

      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];

          try {
            await uploadOnePhoto(file, i);
            successCount++;
          } catch (error) {
            console.error('Upload failed:', error);
            failureCount++;
          }

          const completedCount = successCount + failureCount;
          updateProgressByCount(completedCount, files.length);
          progressLabel.textContent = files.length > 1 ? `Uploaded ${completedCount} of ${files.length}` : 'Upload complete';
        }

        if (successCount > 0 && failureCount === 0) {
          setStatus(`✓ ${successCount} photo${successCount > 1 ? 's' : ''} uploaded successfully!`, 'success');
        } else if (successCount > 0 && failureCount > 0) {
          setStatus(`✓ ${successCount} uploaded, ${failureCount} failed. Please try again.`, 'success');
        } else {
          setStatus('Upload failed for all photos. Please try again.', 'error');
        }

        if (successCount > 0) {
          setTimeout(() => {
            photoInput.value = '';
            updateSelectedFiles();
            setTimeout(() => {
              showProgress(false);
            }, 300);
          }, 1200);
        } else {
          uploadButton.disabled = false;
        }
      } catch (error) {
        setStatus('Upload failed: ' + error.message, 'error');
        uploadButton.disabled = false;
      }
    }

    photoInput.addEventListener('change', updateSelectedFiles);
    uploadButton.addEventListener('click', handleUpload);
    updateSelectedFiles();
  </script>
</body>
</html>
